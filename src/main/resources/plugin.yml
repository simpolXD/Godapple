name: AbyssalDominionGodapple
version: '1.1.0'
main: com.abyssaldominion.godapple.AbyssalDominionGodapple
api-version: '26.2'
softdepend: [PlaceholderAPI, AbyssalDominionFoodEffects]

commands:
  adgodapple:
    description: Main command for AbyssalDominionGodapple
    usage: /<command> <reload|version>
    aliases: [abyssaldominiongodapple]

permissions:
  abyssaldominion.godapple.version:
    description: Allows viewing plugin version and provenance
    default: true
  abyssaldominion.godapple.reload:
    description: Allows reloading the plugin configuration
    default: op
